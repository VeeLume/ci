# VeeLume/ci — reusable push/PR CI for Rust repos.
# Mirrors `just check` + `just test`: fmt -> clippy -> (optional) frontend check -> tests.
# Consume it with a small caller (see templates/ci.yml).
name: rust-ci

on:
  workflow_call:
    inputs:
      os:
        type: string
        default: ubuntu-latest
      toolchain:
        type: string
        default: stable
      fmt:
        description: "Run cargo fmt --check."
        type: boolean
        default: true
      frontend:
        description: "Tauri/JS repos: run pnpm install + pnpm check."
        type: boolean
        default: false
      frontend-dir:
        description: "Directory holding package.json when the frontend isn't at the repo root."
        type: string
        default: "."
      clippy:
        type: boolean
        default: true
      windows-clippy:
        description: "Also run clippy on windows-latest in parallel, so cfg(windows) code is linted."
        type: boolean
        default: false
      audit:
        description: "Run cargo-audit."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # The `full` lane keeps the job name `check`; the optional lane only builds the frontend and runs clippy.
    name: ${{ matrix.lane == 'full' && 'check' || 'clippy (windows)' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(format('[{{"os":"{0}","lane":"full"}}{1}]', inputs.os, inputs.windows-clippy && ',{"os":"windows-latest","lane":"windows-clippy"}' || '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system deps
        if: ${{ runner.os == 'Linux' && hashFiles('**/tauri.conf.json') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.lane }}
          # PRs restore the default branch's cache; only the default branch writes it.
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Setup pnpm
        if: ${{ inputs.frontend }}
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
          package_json_file: ${{ inputs.frontend-dir }}/package.json

      - name: Setup Node
        if: ${{ inputs.frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend-dir }}/pnpm-lock.yaml

      - name: Install frontend deps
        if: ${{ inputs.frontend }}
        working-directory: ${{ inputs.frontend-dir }}
        run: pnpm install

      - name: Build frontend
        if: ${{ inputs.frontend }}
        working-directory: ${{ inputs.frontend-dir }}
        run: pnpm build  # produces frontendDist so cargo can embed it via generate_context!

      - name: Format
        if: ${{ inputs.fmt && matrix.lane == 'full' }}
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ inputs.clippy || matrix.lane == 'windows-clippy' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Frontend check
        if: ${{ inputs.frontend && matrix.lane == 'full' }}
        working-directory: ${{ inputs.frontend-dir }}
        run: pnpm check

      - name: Test
        if: ${{ matrix.lane == 'full' }}
        run: cargo test --workspace

      - name: Audit
        if: ${{ inputs.audit && matrix.lane == 'full' }}
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
